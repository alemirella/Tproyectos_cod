name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL para OWASP ZAP baseline (opcional)"
        required: false
        type: string

permissions:
  contents: read
  security-events: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash scripts/run-security-audit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: security-audit-json
          path: docs/reportes/security/
          retention-days: 30

  secret-scan:
    name: Detección de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar patrones sensibles
        run: |
          set +e
          FOUND=0
          if git grep -nE '(JWT_SECRET|MONGO_URI|password)\s*=\s*[^<].*' -- ':!*.example' ':!*.md' ':!*.yml' ':!.github/**' 2>/dev/null; then
            echo "::warning::Posibles secretos en código — revisar manualmente"
            FOUND=1
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "No se detectaron patrones obvios de secretos hardcodeados."
          fi

  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target_url != '' || vars.ZAP_TARGET_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url || vars.ZAP_TARGET_URL }}
          cmd_options: "-a"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 14
